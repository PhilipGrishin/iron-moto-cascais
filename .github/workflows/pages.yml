name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare public artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp -R \
            404.html \
            CNAME \
            index.html \
            llms.txt \
            robots.txt \
            sitemap.xml \
            about \
            assets \
            blog \
            bmw-service \
            community \
            contact \
            cookies \
            custom \
            ducati-service \
            faq \
            harley-service \
            motorcycle-service \
            motorcycle-tyre-service \
            news \
            parts \
            photos \
            pre-purchase-inspection \
            pricing \
            privacy \
            projects \
            pt \
            ru \
            services \
            terms \
            uk \
            upgrades-tuning \
            _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
