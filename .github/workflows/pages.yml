name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate and publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate checked-in site and Workers
        run: bash scripts/build/verify_site.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare public artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp -R \
            404.html \
            CNAME \
            index.html \
            llms.txt \
            robots.txt \
            sitemap.xml \
            about \
            assets \
            authorized-dealer \
            blog \
            bmw-service \
            community \
            contact \
            cookies \
            custom \
            ducati-service \
            english-speaking-motorcycle-workshop \
            faq \
            harley \
            harley-custom \
            harley-service \
            harley-tuning \
            honda-service \
            motorcycle-service \
            motorcycle-tyre-service \
            news \
            parts \
            photos \
            pre-purchase-inspection \
            pricing \
            proekty \
            royal-enfield-service \
            privacy \
            projects \
            pt \
            ru \
            services \
            suzuki-service \
            thank-you \
            triumph-service \
            terms \
            uk \
            upgrades-tuning \
            _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
