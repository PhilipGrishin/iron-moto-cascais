name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh Google Reviews Snapshot
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Download reviews refresh result
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: reviews-refresh-result
          path: ${{ runner.temp }}/reviews-refresh-result
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Decide whether to deploy
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "workflow_run" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result_file="${{ runner.temp }}/reviews-refresh-result/reviews-refresh-committed.txt"
          committed="$(tr -d '[:space:]' < "$result_file")"
          if [[ "$committed" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: deployment-gate
    if: ${{ needs.deployment-gate.outputs.deploy == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare public artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp -R \
            404.html \
            CNAME \
            index.html \
            llms.txt \
            robots.txt \
            sitemap.xml \
            about \
            assets \
            authorized-dealer \
            blog \
            bmw-service \
            community \
            contact \
            cookies \
            custom \
            ducati-service \
            english-speaking-motorcycle-workshop \
            faq \
            harley \
            harley-custom \
            harley-service \
            harley-tuning \
            honda-service \
            motorcycle-service \
            motorcycle-tyre-service \
            news \
            parts \
            photos \
            pre-purchase-inspection \
            pricing \
            royal-enfield-service \
            privacy \
            projects \
            pt \
            ru \
            services \
            suzuki-service \
            triumph-service \
            terms \
            uk \
            upgrades-tuning \
            _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
