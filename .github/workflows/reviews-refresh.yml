name: Refresh Google Reviews Snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews-refresh
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install beautifulsoup4

      - name: Refresh reviews snapshot and schema
        run: python3 scripts/build/build_reviews_schema.py

      - name: Commit refreshed review data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No review changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reviews-snapshot.json index.html pt/index.html ru/index.html uk/index.html
          git commit -m "Refresh Google reviews snapshot"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "Review changes committed and pushed; the main push will trigger Pages."

      - name: Summarize deployment trigger
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.commit.outputs.committed }}" == "true" ]]; then
            echo "Review changes were pushed; the main push triggers one Pages deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No review changes were pushed; no Pages deployment is triggered." >> "$GITHUB_STEP_SUMMARY"
          fi
