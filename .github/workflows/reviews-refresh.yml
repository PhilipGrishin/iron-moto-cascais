name: Refresh Google Reviews Snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews-refresh
  cancel-in-progress: false

jobs:
  refresh:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build and validation dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh reviews snapshot and schema
        run: |
          python3 scripts/build/build_reviews_schema.py
          python3 scripts/build/build_sitemap.py

      - name: Validate refreshed site and Workers
        run: bash scripts/build/verify_site.sh

      - name: Commit refreshed review data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No review changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- assets/reviews-snapshot.json sitemap.xml '*.html'
          git commit -m "Refresh Google reviews snapshot"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Review changes committed and pushed; the conditional Pages job will deploy them."

      - name: Summarize deployment trigger
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.commit.outputs.committed }}" == "true" ]]; then
            echo "Review changes were pushed; the conditional Pages job will deploy them." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No review changes were pushed; no Pages deployment is triggered." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: refresh
    if: ${{ needs.refresh.outputs.committed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
