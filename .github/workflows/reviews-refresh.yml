name: Refresh Google Reviews Snapshot

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install beautifulsoup4

      - name: Refresh reviews snapshot and schema
        run: python3 scripts/build/build_reviews_schema.py

      - name: Commit refreshed review data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No review changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reviews-snapshot.json index.html pt/index.html ru/index.html uk/index.html
          git commit -m "Refresh Google reviews snapshot"
          git push
